# Quantumult X 配置：只有 Muse / Google / GitHub / Telegram / X 走代理，其余全部直连
# 唯一策略组「国外分流」，包含订阅里的全部节点，手动选择

[general]
server_check_url = http://www.gstatic.com/generate_204
profile_img_url = https://raw.githubusercontent.com/crossutility/Quantumult-X/master/quantumult-x.png

[dns]
no-ipv6
server = 223.5.5.5
server = 119.29.29.29

[policy]
static = 国外分流, server-tag-regex=.*

[server_local]

[server_remote]
# 订阅自己填：把下面这行行首的 # 去掉，换成你自己的订阅链接
# https://example.com/your-subscription, tag=全部节点, update-interval=86400, opt-parser=true, enabled=true

[filter_local]
