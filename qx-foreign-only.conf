# Quantumult X 配置：只有 Muse / Google / GitHub / Telegram / X 走代理，其余全部直连
# 唯一策略组「国外分流」，包含订阅里的全部节点，手动选择

[general]
server_check_url = http://www.gstatic.com/generate_204
profile_img_url = https://raw.githubusercontent.com/crossutility/Quantumult-X/master/quantumult-x.png

[dns]
no-ipv6
server = 223.5.5.5
server = 119.29.29.29

[policy]
static = 国外分流, server-tag-regex=.*

[server_local]

[server_remote]
# 订阅自己填：把下面这行行首的 # 去掉，换成你自己的订阅链接
# https://example.com/your-subscription, tag=全部节点, update-interval=86400, opt-parser=true, enabled=true

[filter_remote]
# 分流规则走引用资源（GitHub）：改规则只改 qx-filter.txt，QX 自动更新，不用重下配置
https://raw.githubusercontent.com/lijing6006/qx-config/refs/heads/main/qx-filter.txt, tag=国外分流规则, update-interval=43200, enabled=true

[filter_local]
# 规则本体在上面的远程分流资源里；这里只留兜底：其余全部直连
FINAL,DIRECT

[rewrite_local]

[rewrite_remote]
# 多邻国 Max 解锁（远程重写资源，在 QX「引用资源-重写」里可见、可开关、可更新）
https://raw.githubusercontent.com/TAKAGIVEGETA/MyScripts/main/lingoDuo/lingoDuo-xaM.conf, tag=Duolingo Max 解锁, update-interval=86400, opt-parser=true, enabled=true

[task_local]

[mitm]
hostname = ios-api-*.duolingo.com, ios-api-*.duolingo.cn, api*.duolingo.com, api*.duolingo.cn
